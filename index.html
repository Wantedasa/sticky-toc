<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Table of Contents — free by wantedasa.dev</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#0d1117; color:#e6edf3; padding:24px; text-align:center; }
  .tag { font-size:.8rem; color:#8b949e; }
  .note { font-size:.8rem; color:#6b7280; max-width:520px; }
  #toc a{display:block;color:#8b949e;text-decoration:none;padding:4px 0}#toc a.active{color:#58a6ff}
</style>
</head>
<body>
<div style="display:flex;gap:18px;width:100%;max-width:560px;text-align:left"><nav id="toc" style="position:sticky;top:12px;align-self:flex-start;min-width:140px;font-size:.85rem"></nav><div id="doc" style="flex:1"><h2>Intro</h2><p style="color:#8b949e">Scroll me.</p><h2>Details</h2><p style="color:#8b949e">More text here.</p><h2>End</h2><p style="color:#8b949e">That is it.</p></div></div>

<script>
var toc=document.getElementById('toc'),doc=document.getElementById('doc');var hs=doc.querySelectorAll('h2');hs.forEach(function(h,i){var a=document.createElement('a');a.href='#';a.textContent=(i+1)+'. '+h.textContent;a.onclick=function(e){e.preventDefault();h.scrollIntoView({behavior:'smooth'});};toc.appendChild(a);});var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var i=Array.prototype.indexOf.call(hs,e.target);toc.querySelectorAll('a').forEach(function(a,j){a.classList.toggle('active',j===i);});}});});hs.forEach(function(h){io.observe(h);});
</script>
</body>
</html>
